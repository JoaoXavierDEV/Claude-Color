name: Release

# Publica o ClaudeColor.exe (arquivo único, .NET embutido) ao enviar uma tag "v*", ex.: git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/ClaudeColor.App -p:PublishProfile=win-x64 -p:Version=$version -o out
          $hash = (Get-FileHash out/ClaudeColor.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # Quebra de linha LF: "sha256sum -c SHA256SUMS.txt" também funciona fora do Windows.
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", "$hash  ClaudeColor.exe`n")
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' out/ClaudeColor.exe out/SHA256SUMS.txt `
            --title "Claude Color ${{ github.ref_name }}" --generate-notes
